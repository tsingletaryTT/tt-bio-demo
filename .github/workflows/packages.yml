# Builds the four Debian packages on every push, and publishes them as a
# GitHub Release when the ref is a tag.
#
# Design: docs/superpowers/specs/2026-08-17-release-ci-design.md
#
# WHAT THIS GATE IS FOR, precisely: "if we make a debian file, is it going to
# be installable?" It runs the packaging tests -- which build the real .debs
# and install them into throwaway ubuntu:24.04 containers -- and the version
# consistency tests. That is all.
#
# What it deliberately does NOT do:
#   - build venv-ui or venv-runner, or install any GTK, OpenGL or torch
#     dependency. The .debs compile nothing and carry no Python runtime; both
#     venvs are built at install time by setup-venvs.sh. Application
#     correctness lives in ./scripts/test.sh, run locally before tagging.
#   - touch Tenstorrent hardware, or pass --device to any container.
#   - run `tt-bio install-deps`, which installs kernel modules.
#   - publish an apt repository or sign anything.
name: packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default. Only the release job widens this, and only to create
# the release.
permissions:
  contents: read

jobs:
  build:
    # PINNED, never ubuntu-latest: debian/changelog targets noble and
    # debian/control names noble-era packages, so the build environment is
    # part of the contract. Moving it must be a deliberate edit here.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # First, and before anything slow: a mis-tagged release should fail in
      # seconds. VERSION's agreement with the changelog and the handout is
      # checked by the test suite below -- only the tag needs CI, because only
      # CI has one.
      - name: The tag must agree with VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(cat VERSION)"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} means version ${tag_version}, but VERSION says ${file_version}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} agrees with VERSION ${file_version}"

      # build-essential is here because dpkg-checkbuilddeps demands it as an
      # IMPLICIT build-dependency of every Debian source package -- it is not
      # in debian/control and nothing else in this list pulls it in. Omitting
      # it failed run 32062850024 in 31s with "Unmet build dependencies:
      # build-essential:native", taking 8 tests and 14 errors down with it.
      # It could not be caught locally: a developer box has build-essential,
      # the runner image does not.
      #
      # Otherwise deliberately short. debhelper/devscripts/dpkg-dev build the packages;
      # poppler-utils backs the handout version check; python3-pytest runs the
      # tests under the SYSTEM interpreter. At module scope the gate's two
      # files import only re, subprocess, pathlib, shutil, tempfile and
      # pytest -- but test_packaging.py also has function-local `import yaml`
      # inside test_every_playlist_input_ships and
      # test_every_playlist_thumbnail_ships, which a top-level-imports scan
      # misses entirely. python3-yaml is listed below for exactly that
      # reason. No venv is needed either way -- everything here runs under
      # the system interpreter. Docker is preinstalled on this runner and the
      # container tests fail rather than skip without it.
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts dpkg-dev \
            poppler-utils \
            python3-pytest python3-yaml

      # The gate: do the packages build, and do they install. tests/unit/
      # conftest.py re-exports the container fixture, so running the two files
      # from the repo root is enough.
      #
      # THE ONE DESELECTION, and why it is a --deselect rather than a skip.
      # test_the_weights_postinst_uses_the_tt_bio_api_that_actually_exists
      # parses tt_bio/main.py out of venv-runner's site-packages to check the
      # postinst calls an API that still exists (it caught hf_artifact being
      # called with the wrong arity once). It therefore needs venv-runner --
      # torch, ttnn and the SFPI toolchain, several GB -- which this workflow
      # deliberately never builds. It does not skip when the venv is absent,
      # it FAILS, which is the right behaviour for a developer and the reason
      # it turned run 32063004690 red.
      #
      # Naming it on the command line keeps the exclusion loud: it is one
      # line in the run log, not a skip buried in the output, and the test
      # still fails properly for anyone running the full suite locally where
      # venv-runner exists. If a second test ever needs excluding, that is a
      # signal to re-examine the scope rather than to lengthen this list.
      - name: Gate — the packages build and install
        run: |
          python3 -m pytest -v \
            tests/unit/test_packaging.py \
            tests/unit/test_version_consistency.py \
            --deselect tests/unit/test_packaging.py::test_the_weights_postinst_uses_the_tt_bio_api_that_actually_exists

      - name: Build the packages
        run: ./scripts/build-deb.sh

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    # Require the push event as well as the tag-shaped ref: workflow_dispatch
    # lets a human pick any ref from the run-workflow ref picker, including
    # an existing tag, and startsWith(github.ref, 'refs/tags/') alone would
    # be satisfied by a manual dispatch on tag v0.1.1 -- which must never
    # publish a release on its own.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    # The only place in this file that can write to the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Downloaded, never rebuilt between jobs: this job installs the exact
      # artifact the build job produced rather than running build-deb.sh
      # again. That is not quite "the artefact that was tested is the
      # artefact that gets published" -- the container install test in
      # test_packaging.py builds its own throwaway .debs into a temp dir via
      # the test harness, a separate invocation from the build job's
      # scripts/build-deb.sh run that produces what's uploaded here. Same
      # source tree and the same build command, so practically equivalent,
      # but two distinct builds, not one shared artifact.
      - name: Download the packages built and tested above
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      # The changelog stanza IS the release notes. It is hand-written Debian
      # prose describing exactly this version; generating notes from commits
      # instead would publish this project's long internal commit messages.
      # WHAT THE RAW OUTPUT ACTUALLY LOOKS LIKE, measured against this repo's
      # own debian/changelog rather than assumed -- every clause below exists
      # because of something in it:
      #
      #     line 1:  (empty)
      #     line 2:  tt-bio-demo (0.1.0) noble; urgency=medium
      #     line 3:  .
      #     line 4:    * Initial Debian packaging scaffold (Task 1 of the ...
      #
      # 1. The stanza header is Debian packaging metadata, not release prose,
      #    and the release page's title already says the version -- so it is
      #    deleted by pattern. An earlier draft used `1d` for this and quietly
      #    did the wrong thing: line 1 is the EMPTY line, so `1d` ate the
      #    blank and published the header. Matching the header itself is what
      #    actually removes it.
      # 2. A fully blank body line arrives as a bare "." or as " ." depending
      #    on position; `s/^ ?\.$//` turns both back into blank lines. Left
      #    alone they publish as literal "." lines.
      # 3. `s/^ //` is cosmetic and does NOT undo an RFC822 prefix -- there
      #    isn't one. dpkg-parsechangelog preserves the file's own 2-space
      #    bullets and 4-space wraps, so this shaves one space to give 1/3
      #    instead of 2/4, keeping the wrapped lines from rendering as
      #    Markdown code blocks.
      # 4. `/./,$!d` drops the leading blank lines left behind by 1 and 2.
      - name: Release notes from debian/changelog
        run: |
          dpkg-parsechangelog -l debian/changelog -S Changes \
            | sed -E '/^tt-bio-demo \(.*urgency=/d; s/^ ?\.$//; s/^ //' \
            | sed '/./,$!d' > release-notes.md
          echo "--- notes ---"
          cat release-notes.md
          # An empty notes file would publish a release with no description,
          # which is a silent failure of this step rather than of the release.
          test -s release-notes.md

      # Creating the release, and refusing to overwrite a published one, are
      # ONE decision and they live in one script -- scripts/publish-release.sh,
      # which tests/unit/test_publish_release.py drives with a stubbed `gh`.
      #
      # They used to be two steps here, and the logic inside a workflow step
      # can only be observed by tagging a release: the most expensive place to
      # discover a bug, and where this one was found. v0.5.5 was cut by
      # creating the release in the GitHub UI, which makes the tag AND the
      # release atomically. The tag push then started this job, the guard saw
      # a release already there and exited 1 -- BEFORE the upload step. The
      # result was a published release with zero assets, while INSTALL.md
      # tells operators to `gh release download --pattern '*.deb'`. The run
      # was red and the release page looked perfectly fine.
      #
      # The invariant is unchanged and is still the point: a published .deb is
      # never replaced. What changed is that it is now tested by asking
      # whether the release HAS ASSETS, rather than whether it exists -- an
      # empty release has no .deb to protect, so it gets filled.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/publish-release.sh "${GITHUB_REF_NAME}" release-notes.md \
            dist/*.deb \
            dist/*.buildinfo \
            dist/*.changes \
            docs/tt-bio-demo-onepager.pdf
