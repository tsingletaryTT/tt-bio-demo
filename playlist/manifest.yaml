- id: dna
  input: ../examples/dna_dickerson.yaml
  name: DNA double helix
  thumbnail: thumbnails/dna.png
  # "one of the two things" since the tRNA entry below joined it. This line
  # used to read "the only thing this booth folds that is not a protein",
  # which stopped being true the moment a second nucleic acid shipped -- and
  # the same claim is on the docs site twice (the molecule card and the
  # "The molecule that is not a protein" heading), so all three moved
  # together.
  tagline: >-
    The double helix, twelve rungs of it — one of the two things this booth
    folds that are not proteins.
  blurb: >-
    Twelve rungs of the double helix. Both strands spell the same twelve
    letters, CGCGAATTCGCG, because each one read backwards is the other --
    which is exactly what lets them clip together -- and the six in the
    middle, GAATTC, are the mark that EcoRI, one of the first gene-cutting
    enzymes ever put to work, searches a genome for. Solved in 1980, this
    twelve-letter piece was the first atom-by-atom look at a full turn of
    DNA and is still the picture the textbooks are drawn from. Watch the
    color: the four proteins here come back mostly yellow and orange,
    because the model is asked to fold them with no evolutionary data to
    lean on. DNA needs none -- the two strands pair by chemistry -- and it
    comes back blue.
  # The measured facts behind that last sentence, so nobody has to take the
  # copy on trust. Six warm folds on card 0, 2026-08-13, protenix-v2:
  # mean pLDDT 95.7 every time (per-atom B-factors 84.2-97.3, i.e. the
  # ribbon is "very high" blue along the strands and "confident" pale blue
  # at the four ends). The `msa: empty` proteins on this same playlist come
  # back at 95.3 (Trp-cage), 50.8 (FKBP12), 52.9 (DHFR) and 39.5 (trypsin).
  #
  # So the honest claim is the one the blurb makes -- three of the four
  # proteins are yellow-to-orange and the DNA is blue -- and NOT "the model
  # is surer of DNA than of any protein", which Trp-cage's 95.3 would make
  # false. Base-pairing is chemically determined in a way that protein
  # folding is not, which is why a nucleic acid does not need the
  # evolutionary signal the three big proteins are missing; a nucleic-acid
  # entity has no `msa:` field to empty in the first place (see
  # examples/dna_dickerson.yaml).
  #
  # Warm timings from those six folds: 6.17s cold (first fold after the
  # model loads), then 4.61 / 4.66 / 4.62 / 4.64 / 4.57s warm -- mean 4.62.
  # 24 nucleotides is the smallest input on the playlist after Trp-cage's 20
  # residues, and it lands within 0.2s of it.
  #
  # tt-bio 0.7.3, chip 0 (see this file's header): first fold of this process
  # paid JIT compilation for the 24->32 token-bucket shape -- 5.7s, discarded
  # -- then two warm folds at 4.9 / 4.8s, pLDDT 95.94 / 95.95. This is the
  # target that pays the largest proportional padding tax on this playlist
  # (24 tokens round up to 32, +33%), which is the whole reason it is one of
  # only two entries here (with Trp-cage) that got slower rather than flat
  # or faster.
  #
  # tt-bio 0.8.0, chip 0 (see this file's header): first fold 5.12s pLDDT
  # 95.95 (discarded), then two warm folds at 4.84 / 4.76s, pLDDT
  # 95.93 / 95.94. Flat to slightly faster vs 0.7.3 (4.9s -> 4.8s).
  # first_frame_s not re-measured this pass.
  expected_s: 4.8
  first_frame_s: 1.1

- id: trna
  input: ../examples/trna_phe.yaml
  name: Transfer RNA
  thumbnail: thumbnails/trna.png
  tagline: >-
    The go-between: it reads three letters of the genetic message and
    carries the matching amino acid.
  blurb: >-
    DNA holds the message and proteins do the work -- this is the molecule
    that gets from one to the other, and the booth folds all three. Three
    bases at one end read one word of the genetic code (these three are
    GAA, which matches the code word for phenylalanine) and the far end of
    the molecule, the whole length of it away, is where that amino acid
    rides. Yeast tRNA-Phe was the first RNA whose three-dimensional shape
    was ever worked out, in 1974, and the surprise then is the thing to
    watch for now: the flat cloverleaf of base pairs biochemists had drawn
    on paper folds back on itself in space, putting its two working ends at
    opposite corners of a compact hinged shape.
  # WHAT THE MODEL ACTUALLY PRODUCED, measured on the fold this entry ships
  # a thumbnail of, because the blurb above makes a claim about the SHAPE
  # and this playlist's rule is that a blurb is accurate to the molecule on
  # screen. All four stems come back correctly Watson-Crick paired --
  # C1'-C1' distances of 10.6-10.7 A across the acceptor stem (1:72, 2:71),
  # the anticodon stem (28:42) and the T stem (49:65), against the
  # canonical ~10.5 -- and the whole thing is as compact as the real
  # molecule: radius of gyration 23.3 A against 23-24 A for crystal tRNA.
  # The two working ends land 71 A apart (crystal: ~75-80 A).
  #
  # WHERE IT DIFFERS, and why the blurb says "hinged" rather than "the
  # famous L": the corner is measured at ~124 degrees here against the
  # crystal structure's ~90, so what a visitor sees is a wide, open elbow
  # rather than the right angle in the textbook picture. Both arms are
  # right and the fold is right; the hinge between them is opened out. The
  # copy is written to describe what is on the screen -- two ends at
  # opposite corners of a hinged shape -- and deliberately does not promise
  # an L the render does not deliver.
  #
  # Measured on this booth's own hardware, in the WARM state a visitor
  # actually meets: 6 folds on card 0, 2026-08-14, protenix-v2. 57.68s cold
  # (first fold after the model loads), then 8.66 / 8.59 / 8.57 / 8.57 /
  # 8.61s warm -- mean 8.60, and the tightest spread of any target here.
  # Mean pLDDT 88.6 on every one of the six, identical to three decimal
  # places: this input is deterministic in a way none of the proteins are.
  # That sits between the DNA duplex (95.7) and the three MSA-less proteins
  # (39.5-52.9), which is what the DNA entry's copy about base-pairing
  # being chemically determined would predict.
  #
  # tt-bio 0.7.3, chip 0 (see this file's header): first fold of this process
  # paid JIT compilation for the 76->96 token-bucket shape -- 27.6s, discarded
  # -- then two warm folds at 6.9 / 6.9s, pLDDT 88.77 / 88.80 -- still the
  # tightest spread of any target here, same as on 0.7.0.
  #
  # tt-bio 0.8.0, chip 0 (see this file's header): first fold 7.73s pLDDT
  # 88.81 (discarded), then two warm folds at 6.92 / 6.83s, pLDDT
  # 88.80 / 88.82 -- still the tightest spread of any target here. Flat vs
  # 0.7.3. first_frame_s not re-measured this pass.
  expected_s: 6.9
  first_frame_s: 2.8
