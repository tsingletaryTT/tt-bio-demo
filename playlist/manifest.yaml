# The booth's playlist: which fold targets a visitor can pick, and where each
# one's input spec lives. Loaded by ui/playlist.py (see that module's
# docstring for the manifest format and, in particular, for why every
# relative path below resolves against THIS FILE'S OWN DIRECTORY -- not the
# process's working directory, which differs between the daemon and the UI.
#
# Six targets ship today: four proteins, a DNA duplex and a transfer RNA --
# which between them are the three kinds of molecule this model handles, and
# (in that order) the three steps of the path from a gene to a protein.
# Trp-cage shipped first (Phase 3a), vendored into examples/ specifically to
# remove a cross-repo absolute path (~/code/tt-boltz/examples/trpcage_no_msa.yaml)
# that this project does not control -- see that file's own header comment;
# the three proteins below it were added in the same spirit, chosen out of
# six `msa: empty` candidates found in the upstream tt-boltz checkout. The
# two nucleic acids (last two entries) came later and are both written from
# scratch, because upstream ships no nucleic-acid example at all.
#
# Why these three and not the other two candidates (see this task's own
# report for the fuller reasoning):
#   - `prot_no_msa.yaml` (117 residues) was EXCLUDED: its protein could not
#     be confidently identified against known structural-biology proteins,
#     and this booth's blurbs must be accurate to the actual molecule, not
#     a plausible-sounding guess.
#   - `hsa_no_msa.yaml` (585 residues, human serum albumin) was EXCLUDED for
#     THIS pass on pacing grounds: it is ~29x Trp-cage's residue count with
#     no measured fold time on this hardware to bound how long that actually
#     runs, and a booth attract loop a visitor watches must not gamble a
#     multi-minute stall on an unmeasured target. Worth reconsidering once a
#     hardware pass (see tests/integration/test_new_targets_timing.py) has
#     real numbers for it.
# The three shipped below (107 / 187 / 223 residues) still span a real
# range from Trp-cage's 20, without that open-ended risk.
#
# The three protein entries below Trp-cage are protein+ligand complexes in
# their *upstream*
# form (each pairs the protein with a small-molecule ligand for tt-boltz's
# own affinity-prediction workflow) but this booth's runner ignores the
# `properties:` block entirely and folds the ligand purely as part of the
# STRUCTURE (see each examples/affinity_*.yaml's own header comment) -- and
# none of the three ligands is actually visible in the rendered ribbon (each
# examples/affinity_*.yaml explains why for its own ligand). The blurbs
# below describe the protein only, for that reason: the CCD ligand itself
# never becomes an on-screen fact for the visitor to check the blurb
# against, so a blurb should not promise seeing it.
#
# `expected_s` is the WARM time a visitor actually meets: measured
# 2026-08-12 from a live run of the real daemon and UI over the socket, with
# the model resident across folds, which is the state the attract loop keeps
# the booth in. Trp-cage 4.45s, FKBP12 11.7s, DHFR 19.7s, trypsin 22.3s.
# The DNA duplex (2026-08-13, same method, six folds on card 0) is 4.6s.
#
# These are deliberately NOT the numbers
# tests/integration/test_new_targets_timing.py prints (62.6 / 69.1 / 74.9s).
# That harness reloads the model per target, so it measures a COLD fold. The
# three new entries were first filled in from its output without applying
# the cold/warm distinction the Trp-cage entry had spelled out since it was
# written -- which would have shipped a gallery card promising ~74.9s for a
# fold a visitor watches finish in 22s. Publish what the visitor experiences.
#
# The "not yet measured" machinery stays in place even though every entry now
# has a number: ui/playlist.py treats a missing `expected_s` as unmeasured
# and ui/gallery.py renders it as an explicit "not yet timed" note rather
# than a fabricated time, so a future target can be added honestly before
# anyone has folded it.
#
# `model` is omitted here on purpose so the Trp-cage entry exercises
# ui/playlist.py's DEFAULT_MODEL fallback (protenix-v2, this project's
# default model everywhere else) for real, rather than only in a synthetic
# unit test. `thumbnail` is omitted because Phase 4 owns the art; the
# gallery (ui/gallery.py) renders a placeholder for any target without one.
# `tagline` is the caption under the LIVE RENDER (ui/app.py's
# `_build_target_info`), not gallery-card copy. One short sentence, written
# to be read at two metres by someone walking past -- which is why it is a
# separate field from `blurb` rather than a truncation of it: `blurb` is for
# a visitor who has already stopped and is choosing, and runs several
# sentences. Every tagline below states the same facts as its own blurb, in
# one line.
#
# `thumbnail` points at a picture of a REAL fold of that target, produced by
# `scripts/make-thumbnails.py` -- it folds each entry on the card and draws
# the result with the booth's own renderer, so a card shows the molecule
# pressing it actually produces. Re-run it when the playlist grows. Both
# fields stay OPTIONAL: a target added before anyone has folded or described
# it still loads, and the gallery still renders a placeholder for it.
- id: trpcage
  input: ../examples/trpcage_no_msa.yaml
  name: Trp-cage
  thumbnail: thumbnails/trpcage.png
  tagline: >-
    Twenty amino acids — one of the smallest proteins that folds itself,
    and it does it in microseconds.
  blurb: >-
    At just 20 amino acids, Trp-cage is one of the smallest proteins known
    to reliably fold into a stable shape on its own, snapping into place in
    only a few microseconds -- fast enough that scientists use it as a
    stripped-down test case for studying how any protein finds its shape at
    all.
  # Measured on this booth's own hardware (docs/followups.md, 30-fold soak):
  # 5.7s cold (first fold after the model loads), 4.35-4.45s warm once the
  # model is resident on the card. The attract loop keeps a fold running
  # continuously, so a visitor's own pick almost always lands warm; 4.4s is
  # the midpoint of the warm range and the representative number to show.
  expected_s: 4.4

- id: fkbp12
  input: ../examples/affinity_fkg.yaml
  name: FKBP12
  thumbnail: thumbnails/fkbp12.png
  tagline: >-
    The molecular lock that anti-rejection drugs are shaped to pick, so a
    transplanted organ survives.
  blurb: >-
    FKBP12 is the molecular lock that a whole class of anti-rejection drugs
    was built to pick: organ-transplant patients take a daily drug called
    tacrolimus specifically because it clicks onto FKBP12 and, together,
    the two jam shut a signal that would otherwise tell the immune system
    to attack the new organ.
  # Measured on this booth's own hardware, in the WARM state a visitor
  # actually meets: mean of 5 folds (11.7s) from a live run of the real
  # daemon+UI over the socket, with the model resident across folds.
  #
  # NOT the 62.6s that tests/integration/test_new_targets_timing.py
  # reports: that harness reloads the model per target, so it measures a
  # COLD fold. The booth's attract loop keeps the model resident, so a
  # visitor's pick lands warm -- the same cold/warm distinction already
  # spelled out on the Trp-cage entry above, and the reason the warm
  # number is the honest one to print on a gallery card.
  expected_s: 11.7

- id: dhfr
  name: Dihydrofolate Reductase
  input: ../examples/affinity_dhfr.yaml
  thumbnail: thumbnails/dhfr.png
  tagline: >-
    Every dividing cell needs it to build new DNA — which is why a classic
    cancer drug jams it shut.
  blurb: >-
    Every dividing cell relies on this enzyme, DHFR, to help build the raw
    material for new DNA -- which is exactly why one of the oldest cancer
    drugs, methotrexate, is shaped to jam it shut instead, starving
    fast-dividing cancer cells of what they need to keep copying themselves.
  # Measured on this booth's own hardware, in the WARM state a visitor
  # actually meets: mean of 6 folds (19.7s) from a live run of the real
  # daemon+UI over the socket, with the model resident across folds.
  #
  # NOT the 69.1s that tests/integration/test_new_targets_timing.py
  # reports: that harness reloads the model per target, so it measures a
  # COLD fold. The booth's attract loop keeps the model resident, so a
  # visitor's pick lands warm -- the same cold/warm distinction already
  # spelled out on the Trp-cage entry above, and the reason the warm
  # number is the honest one to print on a gallery card.
  expected_s: 19.7

- id: trypsin
  input: ../examples/affinity_tryp.yaml
  name: Trypsin
  thumbnail: thumbnails/trypsin.png
  # "the cow's version" tracks the blurb's own correction below: the
  # sequence this booth folds is BOVINE pancreatic trypsin, not human.
  tagline: >-
    Built switched off by the pancreas, armed in the gut, where it cuts up
    the protein in your meal.
  # Two factual errors fixed here (whole-branch review, Critical 6): trypsin
  # is made by the PANCREAS -- as inactive trypsinogen, only switched on
  # once it reaches the small intestine -- not by the intestine itself; and
  # the sequence this booth actually folds is BOVINE (see
  # examples/affinity_tryp.yaml's own header: bovine pancreatic trypsin,
  # 223 residues), so "your own" was wrong about the molecule on screen.
  # Both are the kind of thing a biochemist at the booth catches in the
  # first sentence, which is exactly the audience this playlist is for.
  blurb: >-
    Your pancreas builds trypsin switched off, then releases it into the
    small intestine where it is armed -- and it spends the next few hours
    cutting the protein in your meal into pieces small enough to absorb.
    This is the cow's version, one of the most-studied protein shapes in
    science and often the very first real structure a biochemistry student
    ever examines up close.
  # Measured on this booth's own hardware, in the WARM state a visitor
  # actually meets: mean of 5 folds (22.3s) from a live run of the real
  # daemon+UI over the socket, with the model resident across folds.
  #
  # NOT the 74.9s that tests/integration/test_new_targets_timing.py
  # reports: that harness reloads the model per target, so it measures a
  # COLD fold. The booth's attract loop keeps the model resident, so a
  # visitor's pick lands warm -- the same cold/warm distinction already
  # spelled out on the Trp-cage entry above, and the reason the warm
  # number is the honest one to print on a gallery card.
  expected_s: 22.3

- id: dna
  input: ../examples/dna_dickerson.yaml
  name: DNA double helix
  thumbnail: thumbnails/dna.png
  # "one of the two things" since the tRNA entry below joined it. This line
  # used to read "the only thing this booth folds that is not a protein",
  # which stopped being true the moment a second nucleic acid shipped -- and
  # the same claim is on the docs site twice (the molecule card and the
  # "The molecule that is not a protein" heading), so all three moved
  # together.
  tagline: >-
    The double helix, twelve rungs of it — one of the two things this booth
    folds that are not proteins.
  blurb: >-
    Twelve rungs of the double helix. Both strands spell the same twelve
    letters, CGCGAATTCGCG, because each one read backwards is the other --
    which is exactly what lets them clip together -- and the six in the
    middle, GAATTC, are the mark that EcoRI, one of the first gene-cutting
    enzymes ever put to work, searches a genome for. Solved in 1980, this
    twelve-letter piece was the first atom-by-atom look at a full turn of
    DNA and is still the picture the textbooks are drawn from. Watch the
    colour: the four proteins here come back mostly yellow and orange,
    because the model is asked to fold them with no evolutionary data to
    lean on. DNA needs none -- the two strands pair by chemistry -- and it
    comes back blue.
  # The measured facts behind that last sentence, so nobody has to take the
  # copy on trust. Six warm folds on card 0, 2026-08-13, protenix-v2:
  # mean pLDDT 95.7 every time (per-atom B-factors 84.2-97.3, i.e. the
  # ribbon is "very high" blue along the strands and "confident" pale blue
  # at the four ends). The `msa: empty` proteins on this same playlist come
  # back at 95.3 (Trp-cage), 50.8 (FKBP12), 52.9 (DHFR) and 39.5 (trypsin).
  #
  # So the honest claim is the one the blurb makes -- three of the four
  # proteins are yellow-to-orange and the DNA is blue -- and NOT "the model
  # is surer of DNA than of any protein", which Trp-cage's 95.3 would make
  # false. Base-pairing is chemically determined in a way that protein
  # folding is not, which is why a nucleic acid does not need the
  # evolutionary signal the three big proteins are missing; a nucleic-acid
  # entity has no `msa:` field to empty in the first place (see
  # examples/dna_dickerson.yaml).
  #
  # Warm timings from those six folds: 6.17s cold (first fold after the
  # model loads), then 4.61 / 4.66 / 4.62 / 4.64 / 4.57s warm -- mean 4.62.
  # 24 nucleotides is the smallest input on the playlist after Trp-cage's 20
  # residues, and it lands within 0.2s of it.
  expected_s: 4.6

- id: trna
  input: ../examples/trna_phe.yaml
  name: Transfer RNA
  thumbnail: thumbnails/trna.png
  tagline: >-
    The go-between: it reads three letters of the genetic message and
    carries the matching amino acid.
  blurb: >-
    DNA holds the message and proteins do the work -- this is the molecule
    that gets from one to the other, and the booth folds all three. Three
    bases at one end read one word of the genetic code (these three are
    GAA, which matches the code word for phenylalanine) and the far end of
    the molecule, the whole length of it away, is where that amino acid
    rides. Yeast tRNA-Phe was the first RNA whose three-dimensional shape
    was ever worked out, in 1974, and the surprise then is the thing to
    watch for now: the flat cloverleaf of base pairs biochemists had drawn
    on paper folds back on itself in space, putting its two working ends at
    opposite corners of a compact hinged shape.
  # WHAT THE MODEL ACTUALLY PRODUCED, measured on the fold this entry ships
  # a thumbnail of, because the blurb above makes a claim about the SHAPE
  # and this playlist's rule is that a blurb is accurate to the molecule on
  # screen. All four stems come back correctly Watson-Crick paired --
  # C1'-C1' distances of 10.6-10.7 A across the acceptor stem (1:72, 2:71),
  # the anticodon stem (28:42) and the T stem (49:65), against the
  # canonical ~10.5 -- and the whole thing is as compact as the real
  # molecule: radius of gyration 23.3 A against 23-24 A for crystal tRNA.
  # The two working ends land 71 A apart (crystal: ~75-80 A).
  #
  # WHERE IT DIFFERS, and why the blurb says "hinged" rather than "the
  # famous L": the corner is measured at ~124 degrees here against the
  # crystal structure's ~90, so what a visitor sees is a wide, open elbow
  # rather than the right angle in the textbook picture. Both arms are
  # right and the fold is right; the hinge between them is opened out. The
  # copy is written to describe what is on the screen -- two ends at
  # opposite corners of a hinged shape -- and deliberately does not promise
  # an L the render does not deliver.
  #
  # Measured on this booth's own hardware, in the WARM state a visitor
  # actually meets: 6 folds on card 0, 2026-08-14, protenix-v2. 57.68s cold
  # (first fold after the model loads), then 8.66 / 8.59 / 8.57 / 8.57 /
  # 8.61s warm -- mean 8.60, and the tightest spread of any target here.
  # Mean pLDDT 88.6 on every one of the six, identical to three decimal
  # places: this input is deterministic in a way none of the proteins are.
  # That sits between the DNA duplex (95.7) and the three MSA-less proteins
  # (39.5-52.9), which is what the DNA entry's copy about base-pairing
  # being chemically determined would predict.
  expected_s: 8.6
