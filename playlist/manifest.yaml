# The booth's playlist: which fold targets a visitor can pick, and where each
# one's input spec lives. Loaded by ui/playlist.py (see that module's
# docstring for the manifest format and, in particular, for why every
# relative path below resolves against THIS FILE'S OWN DIRECTORY -- not the
# process's working directory, which differs between the daemon and the UI.
#
# Six targets ship today: four proteins, a DNA duplex and a transfer RNA --
# which between them are the three kinds of molecule this model handles, and
# (in that order) the three steps of the path from a gene to a protein.
# Trp-cage shipped first (Phase 3a), vendored into examples/ specifically to
# remove a cross-repo absolute path (~/code/tt-boltz/examples/trpcage_no_msa.yaml)
# that this project does not control -- see that file's own header comment;
# the three proteins below it were added in the same spirit, chosen out of
# six `msa: empty` candidates found in the upstream tt-boltz checkout. The
# two nucleic acids (last two entries) came later and are both written from
# scratch, because upstream ships no nucleic-acid example at all.
#
# Why these and not the other candidates (see that task's own report for the
# fuller reasoning):
#   - `prot_no_msa.yaml` (117 residues) is EXCLUDED: its protein could not
#     be confidently identified against known structural-biology proteins,
#     and this booth's blurbs must be accurate to the actual molecule, not
#     a plausible-sounding guess.
#   - `hsa_no_msa.yaml` (585 residues, human serum albumin) WAS excluded on
#     pacing grounds -- ~29x Trp-cage with no measured fold time, and an
#     attract loop must not gamble an unmeasured multi-minute stall. That
#     exclusion was lifted on 2026-08-18: tt-bio 0.6.3 made it foldable here,
#     five warm folds put it at a p50 of 97.2s, and the entry below carries
#     that number rather than a guess. It is on the playlist now.
#
# WHAT CHANGED ON 2026-08-18, and why the lineup is not the same three:
# FKBP12 (`affinity_fkg.yaml`, 107 residues) was REMOVED. It folded fine on
# tt-bio 0.6.2 at 11.7s, and on 0.6.3 it fails deterministically in the MSA
# track -- statically allocated circular buffers clashing with L1 buffers,
# reproduced independently in two sessions, first fold of a fresh process or
# mid-sequence alike. It is a shape-dependent L1 allocation bug and not
# "ligands broke": the same protein without its SB3 ligand folds, and DHFR
# with its own ligand folds at nearly twice the residue count. A booth cannot
# ship a card that crashes when a visitor presses it, so the target is out
# until upstream fixes it -- at which point this entry comes back, since the
# blurb and thumbnail machinery for it are unchanged in git history.
#
# MEASURED ON tt-bio 0.8.0, 2026-09-15. Same method as the 0.7.3 pass below
# it: ONE chip (device 0 of a leased pair), one resident Folder, each target
# folded 3 times back to back, first fold of each shape discarded as
# JIT-cold, the two folds after it averaged into `expected_s`.
#
#   target     chip 0 warm   mean pLDDT     vs 0.7.3 (chip 0)    why
#   trpcage      4.6 s        95.33-95.34    4.6 s    (0%)       flat
#   dna          4.8 s        95.93-95.94    4.9 s   (-2%)       flat
#   trna         6.9 s        88.80-88.82    6.9 s    (0%)       flat
#   fkbp12       9.7 s        50.19-51.68    9.7 s    (0%)       flat, same wide spread as ever
#   dhfr        14.5 s        53.23-54.19   14.5 s    (0%)       flat
#   trypsin     17.4 s        39.03-39.32   17.4 s    (0%)       flat
#   hsa         95.5 s        79.48-79.51   95.8 s   (-0.3%)     flat
#
# THIS IS THE FINDING: nothing moved, and that is consistent with what the
# upgrade actually changed. tt-bio 0.8.0's real fixes for Protenix-v2/OpenDDE
# are `modifications:`/`templates:`/`--max_msa_seqs` being honoured instead of
# silently dropped, a hang bug above ~640 residues on Wormhole (980->1024
# residue ceiling, derived from L1 budget instead of token count), and
# `ttnn.close_device()` actually releasing the driver-level card claim. None
# of this playlist's seven targets use `modifications:`/`templates:`, none
# reaches anywhere near the 640-residue hang threshold (HSA is the largest at
# 585), and this measurement folds one target at a time in one process, so
# close_device()'s fix has nothing to exercise here either. Zero pin churn on
# top (`requires-python`, `ttnn==0.68.0` both unchanged), so the vendored SFPI
# toolchain needed no changes -- same as 0.7.0 and 0.7.3 before it.
#
# THE COLD-FOLD GAP IS SMALLER THIS TIME, and that is itself worth recording.
# The 0.7.3 pass's first fold of each shape was inflated 4-5x by JIT kernel
# compilation (trpcage: 25.3s cold vs 4.6s warm) because 0.7.1/0.7.2's
# token-bucketing fix introduced padded shapes (20->32, 585->608, ...) that
# had never been compiled before. 0.8.0 changes none of that bucketing, so
# the persistent kernel cache from the 0.7.3 pass covers the same shapes:
# trpcage's first fold this pass was 8.18s against a 4.6s warm mean (~1.8x,
# not ~5.5x), and HSA's first fold (95.93s) landed INSIDE its own warm band
# (95.40-95.55s) -- essentially no JIT tax at all for the largest target on
# the playlist. Still discarded as a matter of method, not because it moved
# the mean: the next release that touches bucketing will pay this cost again.
#
# THE REAL DEFECT THIS BUMP EXPOSED WAS NOT IN THE NUMBERS ABOVE, IT WAS IN
# GETTING TO THEM AT ALL. `tt_bio.main._read_bio_chains` grew a 5th tuple
# element in 0.8.0 (`modifications`, parallel to the new `modifications:`
# YAML support) -- (chain_id, sequence, msa_spec, mol_type) became
# (chain_id, sequence, msa_spec, mol_type, modifications). `runner/folder.py`
# _run_fold, `runner/daemon.py` _residue_count, and two docs/upstream +
# tests/fixtures scripts all still unpacked 4 values. The first measurement
# attempt on this bump FAILED EVERY SINGLE FOLD -- all seven targets, all
# three folds each, immediately, before any device work -- with "too many
# values to unpack (expected 4)", and no unit test caught it: every existing
# test either monkeypatches `_run_fold` away entirely or only exercises
# `Folder.load()`, never the feature-building path in between. Only a real
# hardware fold surfaced it. Fixed by widening the unpacking to 5 (and, in
# daemon.py's case, keeping `modifications` unused and discarded -- no
# playlist target uses `modifications:`, so wiring it through
# `build_complex_features` would be an untested code path exercised by
# nothing on this booth). `tests/unit/runner/test_folder_events.py` now
# exercises `_run_fold` directly against both the real 5-tuple shape and the
# pre-0.8.0 4-tuple shape, so this exact regression cannot recur silently.
#
# ---------------------------------------------------------------------------
#
# MEASURED ON tt-bio 0.7.3, 2026-09-09. Narrower than the 0.7.0 pass below it:
# ONE chip (device 0 of a leased pair), one resident Folder, each target
# folded 3 times back to back. The first fold of EVERY shape was inflated by
# JIT kernel compilation -- see the table below -- and is excluded from the
# warm numbers; the two folds after it are what "warm" means here. This pass
# did NOT re-measure chip 1, so the drift paragraph below (chips 1/3 settling
# to 906 MHz ~15 minutes into a session) is carried forward unverified this
# round -- it is a hardware/thermal property, not a tt-bio-version one, and
# nothing in this pass gives a reason to doubt it, but "not re-verified" is
# the honest description of what this run actually covered.
#
#   target     chip 0 warm   mean pLDDT     vs 0.7.0 (chip 0)    why
#   trpcage      4.6 s        95.32-95.35    4.2 s   (+10%)      bucket padding: 20->32 tokens
#   dna          4.9 s        95.94-95.95    4.4 s   (+11%)      bucket padding: 24->32 tokens
#   trna         6.9 s        88.77-88.80    7.1 s    (-3%)      76->96 tokens, correctness fix nets out ahead
#   fkbp12       9.7 s        50.38-52.84    9.8 s    (-1%)      107->128 tokens, ~flat
#   dhfr        14.5 s        53.22-53.81   15.5 s    (-6%)      187->192 tokens, small pad + fix
#   trypsin     17.4 s        38.73-39.46   17.4 s     (0%)      223->224 tokens, ~flat
#   hsa         95.8 s        79.24-79.37   97.5 s    (-2%)      585->608 tokens, small pad + fix
#
# THE SHAPE OF THIS TABLE IS THE STORY, not any one row: tt-bio 0.7.1/0.7.2
# fixed a real attention-masking bug (Protenix-v2/OpenDDE were padding the
# atom axis, not the token axis, so a ragged tail reached triangle attention
# as real unmasked key columns -- upstream's own probe measured relative
# error 0.914 ragged against 0.038 masked) by bucketing every model's token
# axis to a multiple of 32. None of this playlist's seven targets land on a
# multiple of 32, so every one of them was folding through the buggy path
# before this pass and now goes through the fixed one. The two SHORTEST
# targets (trpcage 20->32, dna 24->32) pay the largest proportional padding
# tax and are the only two that got slower; every longer target's own
# correctness fix roughly cancels its smaller padding tax, landing flat to
# slightly faster. pLDDT moved by a similar small amount on every target
# (DHFR +1.4, HSA -1.7, DNA/tRNA +0.2-0.3) -- consistent with the fix
# changing real numerics slightly, not with noise: two back-to-back warm
# folds on the same resident model agree with each other to within 0.6 pLDDT
# and 0.1 s on every target above.
#
# expected_s below is the mean of the two warm folds; the excluded cold-JIT
# fold's own time is in each target's own comment further down, next to its
# 0.7.0 history, rather than deleted -- the point of this file's running
# measurement log is that a number is never quietly replaced.
#
# ---------------------------------------------------------------------------
#
# MEASURED ON tt-bio 0.7.0, 2026-08-24. Every number any card, the README, the
# site or the handout prints comes from this one run: three consecutive warm
# folds per target on EACH of two chips (BDF 01:00.0 and 02:00.0), model
# resident, 42 counted folds -- plus a fourth pass per chip, run FIRST and
# discarded, because a version bump empties the JIT kernel cache and the first
# fold of each shape pays compilation (see the cold-start note below).
#
#   target     chip 0    chip 1    mean pLDDT     vs 0.6.4 (chip 0)
#   trpcage      4.2 s     5.3 s     95.24-95.27    4.2 s
#   dna          4.4 s     5.8 s     95.69-95.72    4.4 s
#   trna         7.1 s     7.7 s     88.52-88.57    7.1 s
#   fkbp12       9.8 s    10.4 s     48.25-51.91    9.6 s
#   dhfr        15.5 s    16.2 s     51.52-52.39   15.4 s
#   trypsin     17.4 s    18.2 s     38.36-39.73   17.3 s
#   hsa         97.5 s    98.0 s     80.96-81.14   97.1 s
#
# 0.7.0 reproduces 0.6.4 on every target: chip 0 is within 0.4 s everywhere,
# which is inside each target's own min-max spread across the three folds. The
# `expected_s` values below were refreshed to THIS run's chip-0 medians anyway,
# so the "one run" claim above stays literally true rather than nearly true.
#
# THE CHIP 1 COLUMN IS DRIFT, NOT A VERSION EFFECT, and it is worth reading
# carefully because it looks alarming: DNA at 5.8 s against 4.3 s on 0.6.4 is
# +35%. Chip 1's *minima* over the same three folds are 4.3 / 4.4 / 7.0 / 9.8 /
# 15.5 / 17.4 / 97.5 s -- i.e. chip 1 started level with chip 0 and slowed as
# the run went on. That is the documented behaviour: chips 1 and 3 fall to as
# low as 906 MHz about fifteen minutes into a session (Task 19's two-hour soak,
# docs/followups.md), and chip 1 was measured second here, roughly thirteen
# minutes in. The 0.6.4 run was short enough to stay on the fast side of it and
# recorded "both chips within 0.2 s"; that claim is NOT restated for 0.7.0,
# because this run is long enough to have crossed the drift.
#
# `first_frame_s` (added 2026-08-24) is seconds from `job_start` to that
# target's FIRST `frame` event -- the window in which the fold is running and
# has nothing to draw yet, because only the `diffusion` stage emits frames.
# Measured in the same session as the times above, one fold per target on
# chip 0 (tests/integration/test_new_targets_timing.py prints the table):
#
#   dna 1.1s   trpcage 1.9s   trna 2.8s   fkbp12 5.3s
#   dhfr 10.4s   trypsin 11.7s   hsa 82.7s
#
# It is NOT a fraction of `expected_s` and the ratio is not constant: DNA
# reaches coordinates in a quarter of its fold, albumin in 85% of its. That is
# why it is measured separately rather than derived.
#
# It exists to size the showcase dwell per target. Lingering on a finished
# structure is paid for by suppressing the NEXT fold's opening frames -- the
# daemon never pauses, so that fold is already running -- so the dwell in
# front of a target is capped by ITS OWN first_frame_s. A target that reaches
# coordinates in 1.1s cannot afford a long hold ahead of it; albumin at 82.7s
# can afford any. See `_SHOWCASE_DWELL_MAX_S` in ui/app.py for the clamp and
# the reason the maximum is 7.0s.
#
# WHAT DID NOT HAPPEN, and it was the reason for measuring at all. tt-bio 0.6.7
# fixed two real accuracy bugs in the Protenix-v2 pair trunk both this booth and
# OpenDDE ride on: the mask marking which residue pairs are real reached only
# one of the two triangle multiplications, and `OuterProductMean` added its
# output bias without the scale the reference applies. Upstream reports every
# Protenix-v2 structure leg moving inside the reference's own seed-to-seed
# spread. On THESE seven targets it is not visible: every pLDDT above sits in
# the band 0.6.4 recorded. The likely reason is that all seven are `msa: empty`
# (or nucleic acids, which have no `msa:` key at all), so the pair trunk here
# never carries the MSA depth those bugs distorted most. Recorded because the
# absence is the finding: no gallery blurb's pLDDT claim needed changing.
#
# The first fold after a process start is slower than any of these, because
# kernels for that target's shapes have to compile: 116.3 s for hsa against a
# 96.8 s warm p50. See docs/cold-start.md.
#
# expected_slow_s IS GONE from DHFR and trypsin, and that is deliberate. Those
# slow ends (25.0s, 27.1s) were measured on tt-bio 0.6.2 during a two-hour
# soak, and this pass has no 0.6.3 equivalent: both chips measured the same
# fresh, and the thermal drift that produces the slow end needs ~15 minutes to
# appear. Carrying a 0.6.2 number forward would print an unmeasured claim, and
# scaling it would be inventing one. The drift itself is real and still
# described below and in docs/followups.md -- it just has no measured number on
# this release.
#
# The five below now span 20 / 187 / 223 / 585 residues plus two nucleic
# acids -- a wider range than the lineup they replace, and every number on
# every card is measured on this box.
#
# TWO of the protein entries below (DHFR and trypsin) are protein+ligand
# complexes in their *upstream* form -- each pairs the protein with a
# small-molecule ligand for tt-boltz's own affinity-prediction workflow --
# but this booth's runner ignores the `properties:` block entirely and folds
# the ligand purely as part of the STRUCTURE (see each
# examples/affinity_*.yaml's own header comment), and neither ligand is
# actually visible in the rendered ribbon (each file explains why for its
# own). The blurbs describe the protein only, for that reason: the CCD ligand
# never becomes an on-screen fact for the visitor to check the blurb against,
# so a blurb should not promise seeing it. It was three until FKBP12 was
# removed above; HSA carries no ligand at all.
#
# `expected_s` is the WARM time a visitor actually meets: measured
# 2026-08-12 from a live run of the real daemon and UI over the socket, with
# the model resident across folds, which is the state the attract loop keeps
# the booth in. Trp-cage 4.45s, FKBP12 11.7s, DHFR 19.7s, trypsin 22.3s.
# The DNA duplex (2026-08-13, same method, six folds on card 0) is 4.6s.
#
# These are deliberately NOT the numbers
# tests/integration/test_new_targets_timing.py prints (62.6 / 69.1 / 74.9s).
# That harness reloads the model per target, so it measures a COLD fold. The
# three new entries were first filled in from its output without applying
# the cold/warm distinction the Trp-cage entry had spelled out since it was
# written -- which would have shipped a gallery card promising ~74.9s for a
# fold a visitor watches finish in 22s. Publish what the visitor experiences.
#
# The "not yet measured" machinery stays in place even though every entry now
# has a number: ui/playlist.py treats a missing `expected_s` as unmeasured
# and ui/gallery.py renders it as an explicit "not yet timed" note rather
# than a fabricated time, so a future target can be added honestly before
# anyone has folded it.
#
# `model` is omitted here on purpose so the Trp-cage entry exercises
# ui/playlist.py's DEFAULT_MODEL fallback (protenix-v2, this project's
# default model everywhere else) for real, rather than only in a synthetic
# unit test. `thumbnail` is omitted because Phase 4 owns the art; the
# gallery (ui/gallery.py) renders a placeholder for any target without one.
# `tagline` is the caption under the LIVE RENDER (ui/app.py's
# `_build_target_info`), not gallery-card copy. One short sentence, written
# to be read at two metres by someone walking past -- which is why it is a
# separate field from `blurb` rather than a truncation of it: `blurb` is for
# a visitor who has already stopped and is choosing, and runs several
# sentences. Every tagline below states the same facts as its own blurb, in
# one line.
#
# `thumbnail` points at a picture of a REAL fold of that target, produced by
# `scripts/make-thumbnails.py` -- it folds each entry on the card and draws
# the result with the booth's own renderer, so a card shows the molecule
# pressing it actually produces. Re-run it when the playlist grows. Both
# fields stay OPTIONAL: a target added before anyone has folded or described
# it still loads, and the gallery still renders a placeholder for it.
- id: trpcage
  input: ../examples/trpcage_no_msa.yaml
  name: Trp-cage
  thumbnail: thumbnails/trpcage.png
  tagline: >-
    Twenty amino acids — one of the smallest proteins that folds itself,
    and it does it in microseconds.
  blurb: >-
    At just 20 amino acids, Trp-cage is one of the smallest proteins known
    to reliably fold into a stable shape on its own, snapping into place in
    only a few microseconds -- fast enough that scientists use it as a
    stripped-down test case for studying how any protein finds its shape at
    all.
  # Measured on this booth's own hardware (docs/followups.md, 30-fold soak):
  # 5.7s cold (first fold after the model loads), 4.35-4.45s warm once the
  # model is resident on the card. The attract loop keeps a fold running
  # continuously, so a visitor's own pick almost always lands warm; 4.4s is
  # the midpoint of the warm range and the representative number to show.
  #
  # tt-bio 0.7.3, chip 0 (see this file's header): the first fold of this
  # process paid JIT compilation for the new 20->32 token-bucket shape --
  # 25.3s, discarded -- then two warm folds at 4.6s each, pLDDT 95.32/95.35.
  # first_frame_s was not re-measured this pass (see header); left as-is.
  #
  # tt-bio 0.8.0, chip 0 (see this file's header): first fold 8.18s
  # (discarded -- much less inflated than 0.7.3's 25.3s, since this bump
  # didn't change token-bucketing and the kernel cache carried over), then
  # two warm folds at 4.68 / 4.60s, pLDDT 95.34 / 95.33. Flat vs 0.7.3.
  # first_frame_s not re-measured this pass; left as-is.
  expected_s: 4.6
  first_frame_s: 1.9

- id: hsa
  input: ../examples/hsa_no_msa.yaml
  name: Human serum albumin
  thumbnail: thumbnails/hsa.png
  # tt-bio 0.7.3, chip 0 (see this file's header): first fold of this process
  # paid JIT compilation for the 585->608 token-bucket shape -- 116.8s,
  # discarded -- then two warm folds at 95.7 / 95.9s, pLDDT 79.24 / 79.37 (down
  # ~1.7 from 0.7.0's 80.96-81.14, consistent with the token-bucketing
  # correctness fix changing real numerics slightly on a target this size).
  # first_frame_s was not re-measured this pass; left as-is.
  #
  # tt-bio 0.8.0, chip 0 (see this file's header): first fold 95.93s --
  # landed INSIDE the warm band below rather than paying a JIT tax, because
  # this bump introduced no new token-bucket shapes (kept anyway, as a
  # matter of method) -- then two warm folds at 95.40 / 95.55s, pLDDT
  # 79.51 / 79.48. Flat vs 0.7.3. first_frame_s not re-measured this pass.
  expected_s: 95.5
  first_frame_s: 82.7
  tagline: >-
    The blood's delivery van — the most abundant protein in plasma, and how most drugs travel.
  blurb: >-
    Albumin is the most abundant protein in blood plasma, made by the liver,
    and it is the blood's general-purpose carrier -- it ferries fatty acids,
    hormones and calcium, and a great many drugs ride it to where they act.
    It is also what holds fluid inside the vessels rather than letting it
    leak into tissue, and the "albumin" on a routine blood test.
  # THE LONG ONE, and why it is on the playlist at all.
  #
  # This entry was an explicit EXCLUSION in this file's header from Phase 3b
  # until 2026-08-18, on pacing grounds: 585 residues is ~29x Trp-cage with
  # no measured fold time, and an attract loop must not gamble an unmeasured
  # multi-minute stall. tt-bio 0.6.3 is what made it worth re-asking -- it
  # row-blocks the pair track above a size threshold, so structures reach
  # ~1095 residues, and before it there was a real chance this input could
  # not fold here at all.
  #
  # Measured on this booth's own hardware, chip 0, WARM (model resident, the
  # state a visitor actually meets): five consecutive folds at
  #   chip 0: 97.1 / 96.7 / 96.8 s      chip 1: 97.3 / 97.0 / 97.0 s
  #   -> p50 96.8 s (chip 0), 97.0 s (chip 1)
  # pLDDT 80.96 - 81.18 across all six. An earlier five-fold run on chip 0
  # gave 97.1-100.2 s, and a separate session measured 96.8 s independently;
  # all three agree. The first fold after a process start, with
  # kernels for these shapes not yet compiled, was 116.3 s -- the same
  # cold/warm distinction spelled out on the Trp-cage entry, and the reason
  # the warm number is the honest one to print.
  #
  # IT IS FOUR TIMES THE NEXT-LONGEST TARGET (trypsin, ~17.5 s on 0.6.3), and
  # that is a deliberate pacing choice, not an oversight: it is the one entry
  # that shows a visitor what a real, whole, drug-carrying protein costs. Its
  # trunk stage alone runs ~82 s before the first coordinates exist, so the
  # hero slot holds the PREVIOUS structure, dimmed and captioned, for most of
  # that -- which is the booth working as designed, not a stall.
  #
  # THE SURPRISE, kept here because it is the interesting fact about this
  # entry: at `msa: empty` the other MSA-less proteins land at 39.5
  # (trypsin), 52.9 (DHFR) -- the model saying it is unsure. This one comes
  # back at 81.0 with 0% of residues below 50, and the booth's own assigner
  # calls it 70.8% helix and 0% sheet across 29 helix runs. Real albumin is
  # three homologous all-alpha domains in a heart-shaped bundle, so the shape
  # is right as well as confident.
- id: fkbp12
  input: ../examples/affinity_fkg.yaml
  name: FKBP12
  thumbnail: thumbnails/fkbp12.png
  tagline: >-
    The molecular lock that anti-rejection drugs are shaped to pick, so a
    transplanted organ survives.
  blurb: >-
    FKBP12 is the molecular lock that a whole class of anti-rejection drugs
    was built to pick: organ-transplant patients take a daily drug called
    tacrolimus specifically because it clicks onto FKBP12 and, together,
    the two jam shut a signal that would otherwise tell the immune system
    to attack the new organ.
  expected_s: 9.7
  first_frame_s: 5.3
  # IT LEFT AND CAME BACK, and the number is lower than it ever was.
  #
  # FKBP12 shipped at 11.7s on tt-bio 0.6.2. On 0.6.3 it stopped folding
  # entirely -- a statically allocated circular buffer clashing with L1 buffers
  # in the MSA track, deterministic, first fold of a fresh process or
  # mid-sequence alike -- so it was REMOVED from this playlist on 2026-08-18
  # rather than ship a card that crashes when a visitor presses it.
  #
  # Reported upstream as moritztng/tt-bio#11 with a grid sweep that pinned the
  # cause: the 0.6.3 trimul chunk-width budget was measured on a 130-core
  # p150a, and on a 110-core grid (every p300/p300c) the in-projection matmul's
  # static CBs no longer fit beside the live pair tensors. Fixed in tt-bio
  # 0.6.4: the trimul catches the clash, which throws at program validation
  # before any kernel runs, and retries one chunk width narrower. Narrowing is
  # bit-exact, so the structure is unchanged.
  #
  # Measured on this booth's own hardware on 0.7.0, WARM (model resident),
  # three folds on each of two chips:
  #   chip 0: 9.6 / 10.2 / 9.8 s      chip 1: 10.5 / 10.4 / 9.8 s
  #   -> p50 9.8s (chip 0), 10.4s (chip 1)
  # That is FASTER than the 11.7s it managed before it broke, and unchanged
  # from 0.6.4's 9.6s within this target's own spread. The discarded first
  # fold of each process is slower still -- 12.7s and 11.3s here -- because it
  # pays both the caught clash and JIT kernel compilation; every later fold of
  # this shape starts narrow and precompiled. Chip 1's p50 sits 0.6s high for
  # the drift reason in this file's header, not for a per-target one.
  #
  # No expected_slow_s: see this file's header. The 0.6.2 slow ends came from a
  # two-hour four-chip soak and there is still no equivalent at 0.7.0, so
  # printing one would be an unmeasured claim.
  #
  # pLDDT runs 48.25 - 51.91 across those six folds, a wider spread than the
  # other targets show (they hold to +/-0.05). Worth knowing rather than
