# Affinity questions this booth can ask and answer -- "does this ligand bind
# this protein?" -- loaded by ui/playlist.py's `load_questions()`. See that
# module's docstring for the loader contract and
# docs/superpowers/specs/2026-09-15-affinity-qa-design.md section 7 for why
# these three specifically: each `target_id` below is an existing
# playlist/manifest.yaml entry whose fold input (examples/affinity_*.yaml)
# already carries a protein+ligand pair -- this file is what finally asks a
# question about the ligand rather than only folding the structure around it.
#
# This is a SEPARATE file from manifest.yaml on purpose (see the design
# spec's section 3): a question is not a gallery-pickable fold target, and
# answering one never re-folds anything -- docs/spike-nesso1-affinity.md
# section 3.4 confirmed nesso1 needs no prior fold or coordinates at all, so
# a question rides the existing pick pathway only for its reveal theatre,
# never for the score itself.
#
# ONE QUESTION PER TARGET, DELIBERATELY. `runner/daemon.py::_accept_question`
# resolves the affinity scoring input purely from `target_id` -- it reuses
# the SAME fold file `playlist/manifest.yaml` already points that target at
# (`self._playlist_target(target_id)`), because that file is the one place
# each of these three proteins' baked-in ligand actually lives. A 2026-09-22
# pass tried to grow this to six curated additions naming a SECOND ligand per
# protein (trimethoprim alongside methotrexate for dhfr, etc.) and shipped it
# untested on hardware. Running it for real found two distinct failures:
#
#   - Every "second ligand" question (dhfr_tm, trypsin_pmsf,
#     fkbp12_rapamycin, fkbp12_tacrolimus) silently scored the SAME baked-in
#     ligand as its target's real question, because there is no per-question
#     input file, only a per-TARGET one. Asking "does trimethoprim inhibit
#     DHFR?" returned a real nesso1 score for methotrexate, captioned as
#     trimethoprim -- confirmed by running dhfr_mtx and dhfr_tm back to back
#     on real hardware and getting the same score within noise (0.9764 vs
#     0.9770). That is exactly the fabrication this project's content-honesty
#     rule exists to prevent, just arrived at silently instead of by a typo.
#   - hsa_warfarin/hsa_ibuprofen named a ligand that plain does not exist in
#     hsa's fold input (`examples/hsa_no_msa.yaml` has no ligand entity at
#     all) -- confirmed to always fail with `ValueError: No protein or
#     ligand tokens found in the batch`.
#
# Supporting a real second ligand per protein needs a per-question input
# file (a new vendored example with the correct CCD ligand code) AND a daemon
# change to route the affinity score off `question_id`, not `target_id` --
# real work, not a data fix, and worth its own spec if picked back up. Until
# then this file stays at the three pairs that are actually, verifiably
# correct: one target, one ligand, one question.
#
# `expected_s` is the measured per-question latency on THIS hardware: mean of
# 3 back-to-back warm calls on chip 0 with the model resident, one discarded
# cold call per shape first (2026-09-22), same repeated-measurement
# discipline as every `expected_s` in manifest.yaml. Absent or explicit
# `null` both mean "not yet measured;" ui/questions.py renders a null
# expected_s as "not yet timed," mirroring ui/gallery.py's existing handling
# of an unmeasured fold target.
- id: dhfr_mtx
  target_id: dhfr
  question: "Does methotrexate block dihydrofolate reductase?"
  ligand_name: "Methotrexate"
  expected_s: 10.1

- id: trypsin_bam
  target_id: trypsin
  question: "Does benzamidine block trypsin?"
  ligand_name: "Benzamidine"
  expected_s: 10.7

- id: fkbp12_sb3
  target_id: fkbp12
  question: "Does SB3 bind FKBP12?"
  ligand_name: "SB3"
  expected_s: 8.3
