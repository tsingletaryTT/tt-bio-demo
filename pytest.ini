[pytest]
pythonpath = .
testpaths = tests
# Where a test file lives decides which venv runs it -- see scripts/test.sh's
# header and docs/venv-bootstrap-notes.md, "How the split is decided", for why
# this is a directory boundary and not a marker: pytest must *import* every
# module under testpaths to even see its markers, and tests/unit/'s UI-side
# modules (ui/app.py et al.) hard-fail that import under venv-runner (missing
# `gi`) regardless of any marker -- a marker can't prevent a collection-time
# crash that happens before markers are ever consulted. Only "which directory
# is this file in" can, since it decides whether pytest ever opens the file.
