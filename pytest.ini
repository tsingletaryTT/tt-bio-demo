[pytest]
pythonpath = .
# tests/integration is deliberately NOT part of the default testpaths below,
# even though scripts/test.sh does run it (see that script -- it passes the
# path explicitly once the directory exists, never relying on this default).
# testpaths only governs a bare `pytest` invocation with no path arguments,
# and tests/integration opens a real Tenstorrent device and attempts a real
# fold: it must only ever run when someone asks for it by name (as its own
# module docstring already says), never by accident because a bare `pytest`
# happened to be run in the wrong venv. Concretely, under venv-ui (no
# tt_bio/torch at all) a bare `pytest` including tests/integration in scope
# would open the module fine (Folder itself imports lazily) and only fail
# once a test actually called Folder.load() -- confusing and, on a machine
# with cards present, a real device open attempted from the wrong venv,
# not merely a reporting problem. `pytest tests/integration` explicitly
# still runs it, from whichever venv you ask; only the no-argument default
# excludes it.
testpaths = tests/unit
# Where a test file lives decides which venv runs it -- see scripts/test.sh's
# header and docs/venv-bootstrap-notes.md, "How the split is decided", for why
# this is a directory boundary and not a marker: pytest must *import* every
# module under testpaths to even see its markers, and tests/unit/'s UI-side
# modules (ui/app.py et al.) hard-fail that import under venv-runner (missing
# `gi`) regardless of any marker -- a marker can't prevent a collection-time
# crash that happens before markers are ever consulted. Only "which directory
# is this file in" can, since it decides whether pytest ever opens the file.
