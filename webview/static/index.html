<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tt-bio-demo — remote viewer</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/tensix-viz.css">
<script src="/telemetry.js"></script>
<script src="/tensix_logic.js"></script>
<script src="/tensix-viz.js"></script>
<script src="/tensix.js"></script>
<script src="/qa_panel.js"></script>
<script src="/help_panel.js"></script>
</head>
<body>
  <header class="toolbar">
    <div class="status">
      <span id="live-dot" class="dot dot-off"></span>
      <span id="live-text">connecting…</span>
    </div>
    <div class="title-block">
      <h1 id="booth-title">tt-bio-demo</h1>
      <div id="booth-sub" class="sub">waiting for a daemon…</div>
    </div>
    <button id="view-toggle">Quad view</button>
  </header>

  <div id="notice" class="notice" hidden></div>

  <main id="stage" class="stage" data-mode="solo"></main>

  <section id="telemetry-panel" class="telemetry-panel"></section>

  <div id="tensix-panel" class="tensix-panel"></div>

  <section id="qa-panel" class="panel qa-panel" hidden>
    <h2>Affinity questions</h2>
    <div id="qa-pending" class="qa-pending"></div>
    <div id="qa-in-flight" class="qa-in-flight"></div>
    <div id="qa-answered" class="qa-answered"></div>
  </section>

  <section class="panel pick-panel">
    <h2>Ask the booth to fold</h2>
    <form id="pick-form">
      <input id="pick-input" type="text" placeholder="target id, e.g. trpcage" maxlength="64" autocomplete="off">
      <button type="submit">Pick</button>
    </form>
    <div id="pick-error" class="pick-error" hidden></div>
    <div class="sub gallery-label">Or pick from the playlist:</div>
    <div id="gallery" class="gallery"></div>
  </section>

  <!-- The `?` help overlay: real content from GET /help.json (ui.app's own
       help-content functions, rendered by help_panel.js), reachable two
       ways -- a `?` keydown (mirroring the native GTK booth's own binding,
       for anyone who already knows it) AND this always-visible on-screen
       button (help-open-btn, below), because a remote tunnel viewer has no
       reason to know the native app's keybindings at all. See app.js. -->
  <div id="help-overlay" class="help-overlay" hidden>
    <div id="help-content"></div>
    <button id="help-close">Close</button>
  </div>
  <button id="help-open-btn" class="help-open-btn" title="Help" aria-label="Help">?</button>

  <script src="/app.js"></script>
</body>
</html>
